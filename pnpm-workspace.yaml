# pnpm 11 不再读取 package.json 里的 pnpm.onlyBuiltDependencies，构建脚本白名单改在这里声明。
# 未列入白名单的包在全新安装（CI / Vercel）时会以 ERR_PNPM_IGNORED_BUILDS 报错退出。
# package.json 中的同名配置保留，供 pnpm 10 使用。
packages:
  - '.'

allowBuilds:
  # Vite 的打包器，postinstall 负责下载平台二进制，必须允许
  esbuild: true
  # 以下两个包的安装脚本对构建无用，明确拒绝
  core-js: false
  cos-js-sdk-v5: false

# 间接依赖的安全修复：父包声明的版本范围停留在有已知漏洞的版本，这里强制抬到修复版本。
# 父包发布了带修复的新版本后，对应条目即可删除。
overrides:
  'cos-js-sdk-v5>fast-xml-parser': 4.5.7
  'ali-oss>urllib': ^2.44.1
  qs: ^6.16.1
  'docx>nanoid': ^5.1.16
  dompurify: ^3.4.13
